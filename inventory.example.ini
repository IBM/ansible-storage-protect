# Example Ansible Inventory for IBM Storage Protect
# Copy this file to 'inventory.ini' and customize for your environment

# ============================================
# SP Server Hosts
# ============================================

# Windows SP Servers
[sp_server_windows]
# win-sp-server-01 ansible_host=192.168.1.10 ansible_user=Administrator ansible_password=YourPassword ansible_connection=winrm ansible_winrm_server_cert_validation=ignore

# Linux x86_64 SP Servers
[sp_server_linux]
# linux-sp-server-01 ansible_host=192.168.1.20 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# AIX SP Servers
[sp_server_aix]
# aix-sp-server-01 ansible_host=192.168.1.30 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# PPC64LE (IBM Power) SP Servers
[sp_server_ppc64le]
# power-sp-server-01 ansible_host=192.168.1.40 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
# power-sp-server-02 ansible_host=192.168.1.41 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# ============================================
# SP Client Hosts
# ============================================

[storage_protect_clients]
# client-01 ansible_host=192.168.1.100 ansible_user=root
# client-02 ansible_host=192.168.1.101 ansible_user=root

[storage_protect_server]
# sp-server ansible_host=192.168.1.20 ansible_user=root

# ============================================
# Group Variables
# ============================================

[sp_server_windows:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore

[sp_server_linux:vars]
ansible_python_interpreter=/usr/bin/python3

[sp_server_aix:vars]
ansible_python_interpreter=/usr/bin/python3

[sp_server_ppc64le:vars]
ansible_python_interpreter=/usr/bin/python3
# Ensure Python 3.9+ is installed on PPC64LE systems

# ============================================
# All SP Servers Group
# ============================================

[sp_servers:children]
sp_server_windows
sp_server_linux
sp_server_aix
sp_server_ppc64le

# ============================================
# Notes
# ============================================
# 
# PPC64LE Requirements:
# - Linux on IBM Power Systems (RHEL, SLES, Ubuntu)
# - Python 3.9 or higher
# - Root or sudo access
# - Sufficient disk space for SP Server installation
# 
# Binary Naming Convention:
# - Windows: <version>-IBM-SPOC-WindowsX64.exe
# - Linux x64: <version>-IBM-SPOC-LinuxX64.bin
# - AIX: <version>-IBM-SPOC-AixPPC.bin
# - PPC64LE: <version>-IBM-SPOC-Linuxppc64le.bin
# 
# Example Usage:
# - Install on all platforms: ansible-playbook playbooks/sp_server/playbook.yml -i inventory.ini -e "sp_mode=install"
# - Install on PPC64LE only: ansible-playbook playbooks/sp_server/playbook.yml -i inventory.ini -e "sp_mode=install" --limit sp_server_ppc64le
# - Configure all servers: ansible-playbook playbooks/sp_server/playbook_configure.yml -i inventory.ini

