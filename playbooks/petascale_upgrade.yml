          {% set successfully_upgraded = [] %}
          {% set failed = [] %}
          {% for host in ansible_play_hosts_all %}
          {%   if hostvars[host].ba_client_upgrade_status is defined %}
          {%     if hostvars[host].ba_client_upgrade_status == 'not_installed' %}
          {%       set _ = not_installed.append(host) %}
          {%     elif hostvars[host].ba_client_upgrade_status == 'already_at_target' %}
          {%       set _ = already_at_target.append(host) %}
          {%     elif hostvars[host].ba_client_upgrade_status == 'successfully_upgraded' %}
          {%       set _ = successfully_upgraded.append(host) %}
          {%     elif hostvars[host].ba_client_upgrade_status == 'upgrade_failed' %}
          {%       set _ = failed.append(host) %}
          {%     endif %}
          {%   endif %}
          {% endfor %}
          
          Not Installed ({{ not_installed | length }}):
          {% for host in not_installed %}
            - {{ host }}: BA Client was not installed
          {% endfor %}
          
          Already at Target Version ({{ already_at_target | length }}):
          {% for host in already_at_target %}
            - {{ host }}: {{ hostvars[host].ba_client_current_version }} (target: {{ hostvars[host].ba_client_version }})
          {% endfor %}
          
          Successfully Upgraded ({{ successfully_upgraded | length }}):
          {% for host in successfully_upgraded %}
            - {{ host }}: {{ hostvars[host].ba_client_current_version }} → {{ hostvars[host].ba_client_upgraded_version }}
          {% endfor %}
          
          Failed Upgrades ({{ failed | length }}):
          {% for host in failed %}
            - {{ host }}: ✗ Upgrade failed (check logs)
          {% endfor %}
          
          {% if failed | length > 0 %}
          ⚠️  WARNING: Some upgrades failed!
          - Check the logs above for error details
          - BA Client includes automatic rollback on failure
          - Previous version should be restored automatically
          {% elif successfully_upgraded | length > 0 %}
          ✓ SUCCESS: All upgrades completed successfully!
          - Configuration files preserved
          - Services restarted
          - Verify backups are working
          {% elif already_at_target | length > 0 %}
          ℹ️  INFO: No upgrades needed
          - All specified hosts are already at target version
          {% else %}
          ℹ️  INFO: No BA Clients were upgraded
          - All specified hosts did not have BA Client installed
          {% endif %}
          ============================================================
    
    - name: Fail if any BA Client upgrades failed
      run_once: true
      ansible.builtin.fail:
        msg: |
          ============================================================
          BA CLIENT UPGRADE FAILED
          ============================================================
          
          Upgrade failed on one or more hosts.
          
          Failed hosts:
          {% for host in ansible_play_hosts_all %}
          {%   if hostvars[host].ba_client_upgrade_status is defined %}
          {%     if hostvars[host].ba_client_upgrade_status == 'upgrade_failed' %}
            - {{ host }}
          {%     endif %}
          {%   endif %}
          {% endfor %}
          
          ACTIONS TAKEN:
          - BA Client includes automatic rollback
          - Previous version should be restored
          - Configuration files preserved
          
          NEXT STEPS:
          1. Review the error messages above
          2. Check system logs on failed hosts
          3. Verify previous version is running
          4. Resolve issues before retrying
          
          ============================================================
      when: >
        ansible_play_hosts_all
        | map('extract', hostvars, 'ba_client_upgrade_status')
        | select('defined')
        | select('equalto', 'upgrade_failed')
        | list
        | length > 0

# ============================================================================
# Final Upgrade Summary Report
# ============================================================================
- name: Final Upgrade Summary Report
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Generate final comprehensive upgrade report
      ansible.builtin.debug:
        msg: |
          ============================================================
          PETASCALE UPGRADE COMPLETE - FINAL SUMMARY
          ============================================================
          
          SP SERVER UPGRADES:
          {% set sp_upgraded = 0 %}
          {% set sp_failed = 0 %}
          {% set sp_skipped = 0 %}
          {% for host in groups['sp_servers'] | default([]) %}
          {%   if hostvars[host].sp_server_upgrade_status is defined %}
          {%     if hostvars[host].sp_server_upgrade_status == 'successfully_upgraded' %}
          {%       set sp_upgraded = sp_upgraded + 1 %}
            ✓ {{ host }}: {{ hostvars[host].sp_server_current_version }} → {{ hostvars[host].sp_server_upgraded_version }}
          {%     elif hostvars[host].sp_server_upgrade_status == 'upgrade_failed' %}
          {%       set sp_failed = sp_failed + 1 %}
            ✗ {{ host }}: FAILED
          {%     else %}
          {%       set sp_skipped = sp_skipped + 1 %}
            - {{ host }}: SKIPPED (not installed)
          {%     endif %}
          {%   endif %}
          {% endfor %}
          
          BA CLIENT UPGRADES:
          {% set ba_upgraded = 0 %}
          {% set ba_failed = 0 %}
          {% set ba_skipped = 0 %}
          {% for host in groups['ba_clients'] | default([]) %}
          {%   if hostvars[host].ba_client_upgrade_status is defined %}
          {%     if hostvars[host].ba_client_upgrade_status == 'successfully_upgraded' %}
          {%       set ba_upgraded = ba_upgraded + 1 %}
            ✓ {{ host }}: {{ hostvars[host].ba_client_current_version }} → {{ hostvars[host].ba_client_upgraded_version }}
          {%     elif hostvars[host].ba_client_upgrade_status == 'upgrade_failed' %}
          {%       set ba_failed = ba_failed + 1 %}
            ✗ {{ host }}: FAILED
          {%     else %}
          {%       set ba_skipped = ba_skipped + 1 %}
            - {{ host }}: SKIPPED (not installed)
          {%     endif %}
          {%   endif %}
          {% endfor %}
          
          STATISTICS:
          - SP Servers Upgraded: {{ sp_upgraded }}
          - SP Servers Failed: {{ sp_failed }}
          - SP Servers Skipped: {{ sp_skipped }}
          - BA Clients Upgraded: {{ ba_upgraded }}
          - BA Clients Failed: {{ ba_failed }}
          - BA Clients Skipped: {{ ba_skipped }}
          
          {% if sp_failed + ba_failed == 0 %}
          ✓ SUCCESS: All upgrades completed successfully!
          
          NEXT STEPS:
          1. Verify services are running
          2. Test backup operations
          3. Monitor system performance
          4. Update documentation with new versions
          {% else %}
          ⚠️  WARNING: Some upgrades failed!
          
          NEXT STEPS:
          1. Review error logs above
          2. Check failed hosts
          3. Verify rollback completed (BA Client)
          4. Resolve issues before retrying
          {% endif %}
          
          ============================================================
      run_once: true

