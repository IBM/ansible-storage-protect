# ============================================================================
# BA Client Upgrade (FIRST)
# ============================================================================
# UPGRADE ORDER: 1st BA Client, 2nd HSM Client, 3rd SP Server
- name: Upgrade BA Client on ba_clients nodes
  hosts: ba_clients
  gather_facts: true
  become: true
  
  tasks:
    - name: Display BA Client upgrade configuration
      ansible.builtin.debug:
        msg: |
          ============================================================
          BA Client Upgrade Configuration for {{ inventory_hostname }}
          ============================================================
          Current Version: {{ ba_client_current_version }}
          Target Version: {{ ba_client_version }}
          Package Path: {{ ba_client_package_path }}
          
          Configuration loaded from:
          - playbooks/host_vars/{{ inventory_hostname }}.yml
          - playbooks/group_vars/ba_clients.yml
          - playbooks/group_vars/all.yml
          ============================================================
    
    - name: Skip upgrade if BA Client is not installed
      ansible.builtin.debug:
        msg: "BA Client is not installed on {{ inventory_hostname }}. Skipping upgrade."
      when: not ba_client_installed
    
    - name: Check if already at target version
      ansible.builtin.set_fact:
        ba_client_already_at_target: "{{ ba_client_current_version is search(ba_client_version) }}"
      when: ba_client_installed
    
    - name: Skip upgrade if already at target version
      ansible.builtin.debug:
        msg: |
          ============================================================
          BA Client Already at Target Version - {{ inventory_hostname }}
          ============================================================
          Current Version: {{ ba_client_current_version }}
          Target Version: {{ ba_client_version }}
          
          No upgrade needed. Skipping upgrade process.
          ============================================================
      when:
        - ba_client_installed
        - ba_client_already_at_target | bool
    
    - name: Set BA Client variables for upgrade
      ansible.builtin.set_fact:
        ba_client_state: "present"
        ba_client_action: "upgrade"
        tar_file_path: "{{ ba_client_package_path }}"
        ba_client_extract_dest: "{{ ba_client_extract_dest | default('/opt/baClient') }}"
        ba_client_temp_dest: "{{ ba_client_temp_dest | default('/var/tmp/') }}"
      when:
        - ba_client_installed
        - not (ba_client_already_at_target | default(false) | bool)
    
    - name: Gather system info for compatibility checks
      ansible.builtin.include_role:
        name: system_info
      when:
        - ba_client_installed
        - not (ba_client_already_at_target | default(false) | bool)
    
    - name: Run BA Client upgrade tasks directly
      ansible.builtin.include_tasks: ../roles/ba_client_install/tasks/ba_client_upgrade_linux.yml
      when:
        - ba_client_installed
        - not (ba_client_already_at_target | default(false) | bool)
    
    - name: Verify BA Client upgrade
      ansible.builtin.command: "rpm -q TIVsm-BA"
      register: ba_client_verify
      ignore_errors: true
      changed_when: false
      failed_when: false
      when: ba_client_installed
    
    - name: Extract upgraded version
      ansible.builtin.set_fact:
        ba_client_upgraded_version: "{{ ba_client_verify.stdout | default('Unknown') }}"
      when:
        - ba_client_installed
        - ba_client_verify.rc == 0
    
    - name: Display BA Client upgrade result
      ansible.builtin.debug:
        msg: >-
          {% if not ba_client_installed %}
            BA Client was not installed - No action taken
          {% elif ba_client_verify.rc == 0 and ba_client_upgraded_version is defined %}
            ✓ BA Client successfully upgraded on {{ inventory_hostname }}
            Old Version: {{ ba_client_current_version }}
            New Version: {{ ba_client_upgraded_version }}
          {% else %}
            ✗ BA Client upgrade may have failed on {{ inventory_hostname }}
          {% endif %}
    
    - name: Collect upgrade summary
      ansible.builtin.set_fact:
        ba_client_upgrade_status: >-
          {% if not ba_client_installed %}
            not_installed
          {% elif ba_client_already_at_target | default(false) | bool %}
            already_at_target
          {% elif ba_client_verify.rc == 0 and ba_client_upgraded_version is defined %}
            successfully_upgraded
          {% else %}
            upgrade_failed
          {% endif %}

# ============================================================================
# SP Server Upgrade Summary
# ============================================================================
- name: SP Server Upgrade Summary
  hosts: sp_servers
  gather_facts: false
  
  tasks:
    - name: Generate upgrade summary report
      run_once: true
      ansible.builtin.debug:
        msg: |
          ============================================================
          SP SERVER UPGRADE SUMMARY REPORT
          ============================================================
          {% set not_installed = [] %}
          {% set already_at_target = [] %}
          {% set successfully_upgraded = [] %}
          {% set failed = [] %}
          {% for host in ansible_play_hosts_all %}
          {%   if hostvars[host].sp_server_upgrade_status is defined %}
          {%     if hostvars[host].sp_server_upgrade_status == 'not_installed' %}
          {%       set _ = not_installed.append(host) %}
          {%     elif hostvars[host].sp_server_upgrade_status == 'already_at_target' %}
          {%       set _ = already_at_target.append(host) %}
          {%     elif hostvars[host].sp_server_upgrade_status == 'successfully_upgraded' %}
          {%       set _ = successfully_upgraded.append(host) %}
          {%     elif hostvars[host].sp_server_upgrade_status == 'upgrade_failed' %}
          {%       set _ = failed.append(host) %}
          {%     endif %}
          {%   endif %}
          {% endfor %}
          
          Not Installed ({{ not_installed | length }}):
          {% for host in not_installed %}
            - {{ host }}
          {% endfor %}
          
          Already at Target Version ({{ already_at_target | length }}):
          {% for host in already_at_target %}
            - {{ host }}: {{ hostvars[host].sp_server_current_version }} (target: {{ hostvars[host].sp_server_version }})
          {% endfor %}
          
          Successfully Upgraded ({{ successfully_upgraded | length }}):
          {% for host in successfully_upgraded %}
            - {{ host }}: {{ hostvars[host].sp_server_current_version }} → {{ hostvars[host].sp_server_upgraded_version }}
          {% endfor %}
          
          Failed Upgrades ({{ failed | length }}):
          {% for host in failed %}
            - {{ host }}
          {% endfor %}
          
          {% if failed | length > 0 %}
          ⚠️  WARNING: Some upgrades failed!
          - Check the logs above for error details
          {% elif successfully_upgraded | length > 0 %}
          ✓ SUCCESS: All upgrades completed successfully!
          {% elif already_at_target | length > 0 %}
          ℹ️  INFO: No upgrades needed
          - All specified hosts are already at target version
          {% else %}
          ℹ️  INFO: No SP Servers were upgraded
          - All specified hosts did not have SP Server installed
          {% endif %}
          ============================================================
    
    - name: Fail if any SP Server upgrades failed
      run_once: true
      ansible.builtin.fail:
        msg: "SP Server upgrade failed on one or more hosts. Please check the logs above."
      when: >
        ansible_play_hosts_all
        | map('extract', hostvars, 'sp_server_upgrade_status')
        | select('defined')
        | select('equalto', 'upgrade_failed')
        | list
        | length > 0

# ============================================================================
# HSM Client Upgrade (SECOND)
# ============================================================================
# UPGRADE ORDER: 1st BA Client, 2nd HSM Client, 3rd SP Server
- name: Upgrade HSM Client on hsm_clients nodes
  hosts: hsm_clients
  gather_facts: true
  become: true
  
  tasks:
    - name: Display HSM Client upgrade configuration
      ansible.builtin.debug:
        msg: |
          ============================================================
          HSM Client Upgrade Configuration for {{ inventory_hostname }}
          ============================================================
          Current Version: {{ hsm_client_current_version }}
          Target Version: {{ hsm_client_version }}
          Package Path: {{ hsm_client_package_path | default('NOT SET') }}
          Extract Dest: {{ hsm_client_extract_dest | default('/opt/hsmClient') }}
          
          Configuration loaded from:
          - playbooks/host_vars/{{ inventory_hostname }}.yml
          - playbooks/group_vars/hsm_clients.yml
          - playbooks/group_vars/all.yml
          ============================================================
      when: hsm_client_installed
    
    - name: Check if already at target version
      ansible.builtin.set_fact:
        hsm_client_already_at_target: "{{ hsm_client_current_version is search(hsm_client_version) }}"
      when: hsm_client_installed
    
    - name: Skip upgrade if already at target version
      ansible.builtin.debug:
        msg: |
          ============================================================
          HSM Client Already at Target Version - {{ inventory_hostname }}
          ============================================================
          Current Version: {{ hsm_client_current_version }}
          Target Version: {{ hsm_client_version }}
          
          No upgrade needed. Skipping upgrade process.
          ============================================================
      when:
        - hsm_client_installed
        - hsm_client_already_at_target | bool
    
    - name: Set facts for HSM Client upgrade (when installed and not at target)
      ansible.builtin.set_fact:
        hsm_client_state: "present"
        hsm_client_action: "upgrade"
        tar_file_path: "{{ hsm_client_package_path }}"
      when:
        - hsm_client_installed
        - not (hsm_client_already_at_target | default(false) | bool)
    
    - name: Set facts for HSM Client fresh install (when not installed)
      ansible.builtin.set_fact:
        hsm_client_state: "present"
        hsm_client_action: "install"
        tar_file_path: "{{ hsm_client_package_path }}"
      when: not hsm_client_installed
    
    - name: Call HSM Client upgrade/install using role
      ansible.builtin.include_role:
        name: ../roles/hsm_client_install
      when:
        - hsm_client_installed or not hsm_client_installed
        - not (hsm_client_already_at_target | default(false) | bool)
    
    - name: Verify HSM Client installation/upgrade
      ansible.builtin.command: rpm -q TIVsm-HSM
      register: hsm_client_verify
      ignore_errors: true
      changed_when: false
      failed_when: false
    
    - name: Display HSM Client result
      ansible.builtin.debug:
        msg: >-
          {% if hsm_client_verify.rc == 0 %}
            {% if hsm_client_current_version is defined and hsm_client_current_version != 'Not installed' %}
              ✓ HSM Client successfully upgraded on {{ inventory_hostname }}
              Old Version: {{ hsm_client_current_version }}
              New Version: {{ hsm_client_verify.stdout }}
            {% else %}
              ✓ HSM Client successfully installed on {{ inventory_hostname }}
              Version: {{ hsm_client_verify.stdout }}
            {% endif %}
          {% else %}
            ✗ HSM Client installation/upgrade failed on {{ inventory_hostname }}
          {% endif %}
    
    - name: Collect upgrade summary
      ansible.builtin.set_fact:
        hsm_client_upgrade_status: >-
          {% if not hsm_client_installed %}
            not_installed
          {% elif hsm_client_already_at_target | default(false) | bool %}
            already_at_target
          {% elif hsm_client_verify.rc == 0 %}
            successfully_upgraded
          {% else %}
            upgrade_failed
          {% endif %}
        hsm_client_upgraded_version: "{{ hsm_client_verify.stdout if hsm_client_verify.rc == 0 else 'Unknown' }}"

