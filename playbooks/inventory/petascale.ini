# Petascale Data Protection - Inventory File
#
# Simple inventory for petascale IBM Storage Protect deployments
#
# Reference:
# - Configuration Guide: playbooks/CONFIGURATION_GUIDE.md
# - Design: docs/design/design-peta-scale.md

# ============================================================================
# SP Server Hosts (Petascale Configuration)
# ============================================================================

[sp_servers]
# Primary petascale SP Server
# Uncomment and configure SP Server hosts
# Each host should have a corresponding host_vars file for customization
# Example: playbooks/host_vars/sp-server-01.yml
#sp-server-01 ansible_host=9.11.53.28
#sp-server-01 ansible_host=9.11.53.0
sp-server-02 ansible_host=9.11.53.254 ansible_user=onecloud-user ansible_password=Z9AsnHqFZrPRzw!
#sp-server-03 ansible_host=9.11.53.49
#sp-server-03 ansible_host=circle19.storage.tucson.ibm.com ansible_user=root ansible_password=Bonus%68muckoak
#sp-server-02 ansible_host=9.11.53.254 ansible_user=onecloud-user
#sp-server-03 ansible_host=9.11.53.199
#sp-server-02 ansible_host=9.11.53.42
#sp-server-05 ansible_host=9.11.53.42

[sp_servers:vars]
# Python interpreter is auto-detected based on OS (AIX vs Linux)
# No need to set ansible_python_interpreter manually

# User for SSH connection
ansible_user=onecloud-user

# SSH Key Authentication (REQUIRED - uncomment and set your SSH key path)
# Option 1: Use your SSH key
ansible_ssh_private_key_file=~/.ssh/id_rsa
# Option 2: Or specify password (NOT RECOMMENDED for production)
# ansible_ssh_pass=your_password_here

# Connection settings
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Privilege escalation
ansible_become=yes
ansible_become_method=sudo
# If sudo requires password, uncomment:
# ansible_become_pass=your_sudo_password

