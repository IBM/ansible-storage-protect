- name: Petascale Configuration Summary
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    - name: Record playbook end time
      run_once: true
      ansible.builtin.set_fact:
        petascale_configure_end_epoch: "{{ lookup('pipe', 'date +%s') | int }}"
        petascale_configure_end_time: "{{ lookup('pipe', 'date') }}"
        petascale_configure_elapsed_seconds: "{{ (lookup('pipe', 'date +%s') | int) - (hostvars['localhost'].petascale_configure_start_epoch | default(lookup('pipe', 'date +%s') | int)) }}"

    - name: Generate configuration summary report
      run_once: true
      ansible.builtin.debug:
        msg: |
          ============================================================
          PETASCALE CONFIGURATION SUMMARY REPORT
          ============================================================
          Started At           : {{ hostvars['localhost'].petascale_configure_start_time | default('Unknown') }}
          Finished At          : {{ petascale_configure_end_time }}
          Total Duration       : {{ petascale_configure_elapsed_seconds }} seconds
          SP Servers targeted  : {{ groups['sp_servers'] | default([]) | join(', ') or 'None configured' }}
          BA Clients targeted  : {{ groups['ba_clients'] | default([]) | join(', ') or 'None configured' }}
          HSM Clients targeted : {{ groups['hsm_clients'] | default([]) | join(', ') or 'None configured' }}
          ============================================================
