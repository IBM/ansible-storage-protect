---
# Uninstall HSM Client and all related packages (including BA Client if present)
- name: Check if HSM Client is installed
  ansible.builtin.command: rpm -q TIVsm-HSM
  register: hsm_uninstall_check
  ignore_errors: true
  changed_when: false

- name: Extract installed HSM Client version
  ansible.builtin.set_fact:
    installed_hsm_version: >-
      {{
        hsm_uninstall_check.stdout.split('-')[2] ~ '.' ~
        hsm_uninstall_check.stdout.split('-')[3].split('.')[0]
      }}
  when: hsm_uninstall_check.rc == 0

- name: Display version information
  ansible.builtin.debug:
    msg: |
      Installed HSM Client version: {{ installed_hsm_version | default('Not installed') }}
      Version specified in host_vars: {{ hsm_client_version | default('Not specified') }}
  when: hsm_uninstall_check.rc == 0

- name: Validate version match before uninstall
  ansible.builtin.fail:
    msg: |
      ============================================================
      VERSION MISMATCH - UNINSTALL ABORTED
      ============================================================
      
      Installed HSM Client version: {{ installed_hsm_version }}
      Version specified in host_vars: {{ hsm_client_version }}
      
      ERROR: The installed version does not match the version
      specified in your host_vars file ({{ inventory_hostname }}.yml).
      
      This is a safety check to prevent accidental uninstallation
      of the wrong version.
      
      ACTIONS:
      1. If you want to uninstall version {{ installed_hsm_version }}:
         Update playbooks/host_vars/{{ inventory_hostname }}.yml
         Set: hsm_client_version: "{{ installed_hsm_version }}"
      
      2. If you want to force uninstall regardless of version:
         Add this variable to your playbook execution:
         -e "force_uninstall=yes"
      
      3. To check what's installed on this host:
         ansible {{ inventory_hostname }} -i playbooks/inventory/petascale.ini \
           -m shell -a "rpm -q TIVsm-HSM" --become
      
      ============================================================
  when:
    - hsm_uninstall_check.rc == 0
    - installed_hsm_version is defined
    - hsm_client_version is defined
    - installed_hsm_version != hsm_client_version
    - force_uninstall is not defined or force_uninstall != "yes"

- name: Check if BA Client is installed
  ansible.builtin.command: rpm -q TIVsm-BA
  register: ba_uninstall_check
  ignore_errors: true
  changed_when: false

- name: Check for any TIVsm packages
  ansible.builtin.command: rpm -qa 'TIVsm*'
  register: any_tivoli_packages
  ignore_errors: true
  changed_when: false

- name: Display installation status
  ansible.builtin.debug:
    msg: |
      HSM Client installed: {{ 'Yes' if hsm_uninstall_check.rc == 0 else 'No' }}
      BA Client installed: {{ 'Yes' if ba_uninstall_check.rc == 0 else 'No' }}
      All TIVsm packages: {{ any_tivoli_packages.stdout_lines if any_tivoli_packages.stdout_lines | length > 0 else 'None' }}

- name: Skip uninstallation if nothing is installed
  ansible.builtin.meta: end_play
  when:
    - hsm_uninstall_check.rc != 0
    - ba_uninstall_check.rc != 0
    - any_tivoli_packages.stdout_lines | length == 0

# Stop HSM daemon/service
- name: Stop dsmhsm service
  ansible.builtin.systemd:
    name: dsmhsm.service
    state: stopped
  register: stop_service_result
  failed_when: false
  changed_when: stop_service_result.changed | default(false)

- name: Display service stop status
  ansible.builtin.debug:
    msg: "ℹ️  HSM service {{ 'stopped successfully' if stop_service_result.changed else 'was not running or not found' }}"
  when: stop_service_result is defined

- name: Kill any running HSM processes
  ansible.builtin.command: killall dsmhsm
  register: kill_processes_result
  failed_when: false
  changed_when: false

- name: Display process kill status
  ansible.builtin.debug:
    msg: "ℹ️  HSM processes {{ 'terminated' if kill_processes_result.rc == 0 else 'not found (already stopped)' }}"
  when: kill_processes_result is defined

# Backup configuration files before uninstall
- name: Backup dsm.opt configuration file
  ansible.builtin.copy:
    src: /opt/tivoli/tsm/client/hsm/bin/dsm.opt
    dest: /opt/tivoli/tsm/client/hsm/bin/dsm.opt.bk
    remote_src: true
  register: backup_opt_result
  failed_when: false

- name: Display dsm.opt backup status
  ansible.builtin.debug:
    msg: "ℹ️  Configuration file dsm.opt {{ 'backed up successfully' if backup_opt_result.changed else 'not found (skipped)' }}"
  when: backup_opt_result is defined

- name: Backup dsm.sys configuration file
  ansible.builtin.copy:
    src: /opt/tivoli/tsm/client/hsm/bin/dsm.sys
    dest: /opt/tivoli/tsm/client/hsm/bin/dsm.sys.bk
    remote_src: true
  register: backup_sys_result
  failed_when: false

- name: Display dsm.sys backup status
  ansible.builtin.debug:
    msg: "ℹ️  Configuration file dsm.sys {{ 'backed up successfully' if backup_sys_result.changed else 'not found (skipped)' }}"
  when: backup_sys_result is defined

# Create backup directory for RPMs
- name: Create backup directory for RPM packages
  ansible.builtin.file:
    path: /opt/hsmClientPackagesBk
    state: directory
    mode: '0755'

# Backup RPM packages from extraction directory
- name: Find RPM files in extraction directory
  ansible.builtin.find:
    paths: /opt/hsmClient
    patterns: "*.rpm"
    recurse: true
  register: rpm_files_to_backup
  ignore_errors: true

- name: Backup RPM files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: /opt/hsmClientPackagesBk/
    remote_src: true
  loop: "{{ rpm_files_to_backup.files }}"
  when: rpm_files_to_backup.files is defined and rpm_files_to_backup.files | length > 0
  ignore_errors: true

# Define uninstall order (reverse of install order) - includes both HSM and BA packages
- name: Define package uninstall order
  ansible.builtin.set_fact:
    uninstall_packages:
      - "TIVsm-HSM"        # HSM Client
      - "TIVsm-WEBGUI"     # Web GUI (depends on BA)
      - "TIVsm-BA"         # BA Client
      - "TIVsm-BAcit"      # BA Client CIT
      - "TIVsm-APIcit"     # API CIT
      - "TIVsm-API64"      # API 64-bit
      - "gskssl64"         # GSKit SSL
      - "gskcrypt64"       # GSKit Crypto

# Uninstall packages
- name: Uninstall HSM Client packages
  block:
    - name: Check and uninstall each package
      ansible.builtin.command: "rpm -e --nodeps {{ item }}"
      loop: "{{ uninstall_packages }}"
      register: uninstall_results
      failed_when: false
      changed_when: uninstall_results.rc == 0

    - name: Display uninstall results
      ansible.builtin.debug:
        msg: "{{ '✓' if item.rc == 0 else 'ℹ️' }}  Package {{ item.item }}: {{ 'Removed successfully' if item.rc == 0 else 'Not installed (skipped)' }}"
      loop: "{{ uninstall_results.results }}"
      when: uninstall_results is defined

  rescue:
    - name: Handle uninstall failure
      ansible.builtin.debug:
        msg: "⚠️  Some packages encountered issues. Attempting force removal."

    - name: Force uninstall packages
      ansible.builtin.command: "rpm -e --nodeps {{ item }}"
      loop: "{{ uninstall_packages }}"
      failed_when: false
      changed_when: true

# Verify uninstallation
- name: Verify HSM Client uninstallation
  ansible.builtin.command: rpm -q TIVsm-HSM
  register: verify_hsm_uninstall
  failed_when: false
  changed_when: false

- name: Verify BA Client uninstallation
  ansible.builtin.command: rpm -q TIVsm-BA
  register: verify_ba_uninstall
  failed_when: false
  changed_when: false

- name: Display uninstallation status
  ansible.builtin.debug:
    msg: |
      HSM Client: {{ 'Successfully removed' if verify_hsm_uninstall.rc != 0 else 'Still present (or was not installed)' }}
      BA Client: {{ 'Successfully removed' if verify_ba_uninstall.rc != 0 else 'Still present (or was not installed)' }}

- name: Check for remaining TIVsm packages
  ansible.builtin.command: rpm -qa 'TIVsm*'
  register: remaining_packages
  changed_when: false
  ignore_errors: true

- name: Display remaining packages
  ansible.builtin.debug:
    msg: "Remaining TIVsm packages: {{ remaining_packages.stdout_lines if remaining_packages.stdout_lines | length > 0 else 'None - All packages removed successfully' }}"

# Cleanup extraction directory
- name: Remove extraction directory
  ansible.builtin.file:
    path: /opt/hsmClient
    state: absent
  ignore_errors: true

# Cleanup backup directory (only if uninstall was successful)
- name: Remove backup directory after successful uninstall
  ansible.builtin.file:
    path: /opt/hsmClientPackagesBk
    state: absent
  when: verify_hsm_uninstall.rc != 0
  ignore_errors: true

- name: Uninstallation complete
  ansible.builtin.debug:
    msg: "HSM/BA Client uninstallation process completed. Configuration backups retained at /opt/tivoli/tsm/client/*/bin/*.bk"
...
