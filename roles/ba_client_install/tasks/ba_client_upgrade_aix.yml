---
# ======================== Pre-checks before upgrading the BA Client ==========

- name: Check if BA Client is installed before upgrade (AIX)
  ansible.builtin.command: lslpp -l tivoli.tsm.client.ba.64bit.base
  register: ba_client_check
  ignore_errors: true
  changed_when: false

# Display a message if BA Client is not installed
- name: Display message if BA Client is not installed
  ansible.builtin.debug:
    msg: "BA Client is not installed on the system. Skipping upgrade process."
  when: ba_client_check.rc != 0

# Fail or Skip the Upgrade Play
- name: Skip upgrade if BA Client is not installed
  ansible.builtin.meta: end_play
  when: ba_client_check.rc != 0

# ============= Uninstalling the BA Client before performing upgrade ===========

- name: Uninstall the BA Client before upgrade
  ansible.builtin.include_tasks: ba_client_uninstall_aix.yml

# ============= Installing the new version of BA Client ===========

- name: Upgrading the BA Client
  ansible.builtin.include_tasks: ba_client_install_aix.yml

- name: Debug the install result
  ansible.builtin.debug:
    var: is_installation_successful

# === During upgrade, if any error occurs while installing the new version ===
# ===  to maintain the state of system we re-install the previous BA Client version and restore the old configuration files ===
# === if upgrade is unsuccessful ===
- name: Rollback on upgrade failure
  when: not is_installation_successful
  block:
    - name: Check if backup files exist
      ansible.builtin.stat:
        path: "{{ item }}.bk"
      with_items:
        - "/opt/tivoli/tsm/client/ba/bin/dsm.opt"
        - "/opt/tivoli/tsm/client/ba/bin/dsm.sys"
      register: backup_files_status

    - name: Restore original configuration files if backup exists
      ansible.builtin.copy:
        src: "{{ item.item }}.bk"
        dest: "{{ item.item }}"
        remote_src: true
        mode: '0644'
      with_items: "{{ backup_files_status.results }}"
      when: item.stat.exists

#      before starting the upgrade, previous packages are backed up in /opt/baClientPackagesBk
#      this packages will be used to reinstall the previous version
    - name: Finding extracted files
      ansible.builtin.find:
        paths: /opt/baClientPackagesBk
        recurse: true
      register: extracted_files

    # Installing GSKit packages using installp - dynamically find BFF files
    - name: Install or upgrade GSKit crypt library (gskcrypt) on AIX
      ansible.builtin.command: installp -acXYgd {{ item }} all
      with_items: "{{ extracted_files.files | map(attribute='path') | select('search', 'GSKit.*gskcrypt.*') | reject('search', '\\.sig$') | list }}"
      when: extracted_files is defined and extracted_files.files | length > 0
      register: gskcrypt_install_result
      failed_when: false
      changed_when: gskcrypt_install_result.rc == 0

    - name: Install or upgrade GSKit SSL library (gskssl) on AIX
      ansible.builtin.command: installp -acXYgd {{ item }} all
      with_items: "{{ extracted_files.files | map(attribute='path') | select('search', 'GSKit.*gskssl.*') | reject('search', '\\.sig$') | list }}"
      when: extracted_files is defined and extracted_files.files | length > 0
      register: gskssl_install_result
      failed_when: false
      changed_when: gskssl_install_result.rc == 0

    # Installing TIVsm packages using installp - dynamically find BFF files
    - name: Install or upgrade API64 package on AIX
      ansible.builtin.command: installp -acXYgd {{ item }} all
      with_items: "{{ extracted_files.files | map(attribute='path') | select('search', 'tivoli\\.tsm\\.client\\.api') | reject('search', '\\.sig$') | list }}"
      register: api64_install_result
      ignore_errors: false
      changed_when: api64_install_result.rc == 0

    # Installing BA package
    - name: Install or upgrade BA package on AIX
      ansible.builtin.command: installp -acXYgd {{ item }} all
      with_items: "{{ extracted_files.files | map(attribute='path') | select('search', 'tivoli\\.tsm\\.client\\.ba') | reject('search', '\\.sig$') | list }}"
      register: ba_install_result
      ignore_errors: false
      changed_when: ba_install_result.rc == 0

    # Optional: Install WebGUI if needed
    - name: Install or upgrade WebGUI package on AIX
      ansible.builtin.command: installp -acXYgd {{ item }} all
      with_items: "{{ extracted_files.files | map(attribute='path') | select('search', 'tivoli\\.tsm\\.client\\.webgui') | reject('search', '\\.sig$') | list }}"
      register: webgui_install_result
      failed_when: false
      changed_when: webgui_install_result.rc == 0

    - name: Delete backup directory after restoring the previous state
      ansible.builtin.file:
        path: /opt/baClientPackagesBk
        state: absent
      when: uninstall_result is defined

    - name: Fail the upgrade process
      ansible.builtin.fail:
        msg: >
          Upgrade failed. Restored original configuration files and reinstalled uninstalled packages to maintain system stability.

# ===================== if upgrade is successful ============================

# Restore backup files to their original names
- name: Restoring .bk files to original files after successful upgrade
  ansible.builtin.copy:
    src: "{{ item }}.bk"
    dest: "{{ item }}"
    remote_src: true
    mode: '0644'
  with_items:
    - "/opt/tivoli/tsm/client/ba/bin/dsm.opt"
    - "/opt/tivoli/tsm/client/ba/bin/dsm.sys"
  failed_when: false
  when: is_installation_successful

# Remove the .bk files after restoration
- name: Remove .bk files after restoring to original
  ansible.builtin.file:
    path: "{{ item }}.bk"
    state: absent
  with_items:
    - "/opt/tivoli/tsm/client/ba/bin/dsm.opt"
    - "/opt/tivoli/tsm/client/ba/bin/dsm.sys"
  failed_when: false
  when: is_installation_successful

- name: Delete backup directory on successful upgrade
  ansible.builtin.file:
    path: /opt/baClientPackagesBk
    state: absent
  when: uninstall_result is defined

# Display upgrade success message
- name: Display upgrade success message
  ansible.builtin.debug:
    msg: "BA Client has been successfully upgraded to version {{ ba_client_version }}."
  when: is_installation_successful

# =============== start the daemon =============

# Enable dsmcad service on AIX
- name: Enable dsmcad service on AIX
  ansible.builtin.command: mkitab "dsmcad:2:once:/usr/bin/dsmcad > /dev/console 2>&1"
  when: ba_client_start_daemon
  failed_when: false
  register: dsmcad_enable_result

# Start dsmcad service on AIX
- name: Start dsmcad service on AIX
  ansible.builtin.command: startsrc -s dsmcad
  when: ba_client_start_daemon
  register: dsmcad_start_result
  failed_when: false

# Check if dsmcad service is running
- name: Check if dsmcad service is running on AIX
  ansible.builtin.command: lssrc -s dsmcad
  register: dsmcad_status
  failed_when: false
  when: ba_client_start_daemon
  changed_when: false

# Verify if the service is running and provide output
- name: Check if dsmcad service is successfully started
  ansible.builtin.debug:
    msg: "dsmcad started successfully."
  when: ba_client_start_daemon and dsmcad_status.stdout is search('active')

# Output message if the service is not running
- name: Check if dsmcad service failed to start
  ansible.builtin.debug:
    msg: "Failed to start dsmcad service."
  when: ba_client_start_daemon and dsmcad_status.stdout is not search('active')
...

