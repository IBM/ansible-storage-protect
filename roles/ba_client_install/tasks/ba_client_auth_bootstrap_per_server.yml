- name: Restore BA dsm.opt default server after {{ auth_target.name }} bootstrap
  ansible.builtin.copy:
    dest: /opt/tivoli/tsm/client/ba/bin/dsm.opt
    content: |
      SERVERNAME {{ (ba_dsmopt_default_before.stdout | trim) if (ba_dsmopt_default_before.stdout | trim) else auth_target.name }}
    owner: root
    group: root
    mode: '0644'
  failed_when: false

