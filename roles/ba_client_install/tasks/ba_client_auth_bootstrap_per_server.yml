# Per-server PROMPT -> GENERATE auth bootstrap for multi-server/client flows

- name: Force BA dsm.sys stanza to PASSWORDACCESS PROMPT for bootstrap
  ansible.builtin.shell: |
    python3 - <<'PY'
    from pathlib import Path
    path = Path('/opt/tivoli/tsm/client/ba/bin/dsm.sys')
    server = '{{ auth_target.name }}'
    if not path.exists():
        raise SystemExit(0)
    lines = path.read_text().splitlines()
    out = []
    in_target = False
    for line in lines:
        stripped = line.strip()
        upper = stripped.upper()
        if upper.startswith('SERVERNAME '):
            parts = stripped.split(None, 1)
            in_target = len(parts) > 1 and parts[1] == server
        if in_target and upper.startswith('PASSWORDACCESS'):
            indent = line[:len(line) - len(line.lstrip())]
            line = f"{indent}PASSWORDACCESS     PROMPT"
        out.append(line)
    path.write_text('\n'.join(out) + '\n')
    PY
  changed_when: false
  failed_when: false

