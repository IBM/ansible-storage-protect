- name: Install or Upgrade SP Server
  block:
    - name: Delete the existing directory
      ansible.builtin.file:
        path: "{{ sp_server_temp_dest }}"
        state: absent

    - name: Creating required directories for server installation
      ansible.builtin.file:
        path: "{{ sp_server_temp_dest }}"
        state: directory
        mode: '0755'

    - name: Debug the binary path
      debug:
        var: sp_server_temp_dest

    - name: Install required packages on remote VMs (cross-platform)
      ansible.builtin.shell: |
        if command -v dnf >/dev/null 2>&1; then
          dnf install -y rsync lsof 2>&1 || echo "Packages may already be installed"
        elif command -v yum >/dev/null 2>&1; then
          yum install -y rsync lsof 2>&1 || echo "Packages may already be installed"
        else
          # AIX or other Unix - check if packages exist
          echo "Package manager (dnf/yum) not found. Checking for required tools..."
          which rsync >/dev/null 2>&1 && echo "rsync: already available" || echo "rsync: not found (may need manual installation)"
          which lsof >/dev/null 2>&1 && echo "lsof: already available" || echo "lsof: not found (may need manual installation)"
        fi
      register: package_install_result
      changed_when: "'Nothing to do' not in package_install_result.stdout and 'already installed' not in package_install_result.stdout and 'already available' not in package_install_result.stdout"
      failed_when: false
      become: true

    # Binary is already on remote node, just copy it to the temp directory
    - name: Copy binary from remote location to temp directory
      ansible.builtin.copy:
        src: "{{ sp_server_binary_file_path }}"
        dest: "{{ sp_server_temp_dest }}/{{ sp_server_binary_file_path | basename }}"
        remote_src: yes
        mode: "0755"
      register: copy_result

    # Validate file copy
    - name: Validating binary copy
      ansible.builtin.fail:
        msg: >
          Binary copy on remote host failed.
          Error details: {{ copy_result.msg | default('No error details available.') }}
      when: copy_result.failed | default(false)

    # Ensure the binary is executable
    - name: Ensure binary is executable
      ansible.builtin.file:
        path: "{{ sp_server_temp_dest }}/{{ sp_server_binary_file_path | basename }}"
        mode: "0755"

    # Generate response.xml for installation
    - name: Generate response.xml
      ansible.builtin.template:
        src: sp_server_install_response.xml.j2
        dest: "{{ sp_server_temp_dest }}/response.xml"

    # Check if repository already exists (binary already extracted)
    - name: Check if repository directory exists
      ansible.builtin.stat:
        path: "{{ sp_server_temp_dest }}/repository"
      register: repository_stat

    # Execute the binary to initialize the repository only if not already extracted
    - name: Execute binary to extract repository
      ansible.builtin.command: "./{{ sp_server_binary_file_path | basename }}"
      args:
        chdir: "{{ sp_server_temp_dest }}"
      register: sp_server_binary_status
      become: true

    # Execute install.sh with the generated response.xml
    - name: Execute install.sh with response.xml for installation
      ansible.builtin.command:
        argv:
          - ./install.sh
          - -s
          - -input
          - "{{ sp_server_temp_dest }}/response.xml"
          - -acceptLicense
      args:
        chdir: "{{ sp_server_temp_dest }}"
      register: sp_server_installation_result
      become: true

    - name: Verfiy Installation of sp server
      ansible.builtin.include_tasks: sp_server_postchecks_linux.yml

    - name: SP Server Installation Success
      ansible.builtin.debug:
        msg: |
          Installation Successful
          Version: {{ sp_server_version }}
          {{ installed_components }}
      when: imcl_output_lines | length > 0 and sp_server_action == "install"

    - name: SP Server Upgrade Success
      ansible.builtin.debug:
        msg: |
          Upgrade Successful
          Version: {{ sp_server_version }}
          {{ installed_components }}
      when: imcl_output_lines | length > 0 and sp_server_action == "upgrade"

  rescue:
#    - No rollback mechanism is needed if upgrade fails, since previous version is not uninstalled.
    - name: Rollback if installation fails
      when: not sp_server_installation_status and sp_server_action == "install"
      block:
        - name: Checking for installed packages
          ansible.builtin.include_tasks: sp_server_postchecks_linux.yml

        # Temporarily commented to examine response.xml
        # - name: Delete the created directories and remove binaries
        #   ansible.builtin.file:
