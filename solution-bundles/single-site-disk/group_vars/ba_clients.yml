---
# IBM Storage Protect BA Client Configuration
# Group Variables for BA Clients

# ============================================================================
# Version Configuration
# ============================================================================
ba_client_version: "8.1.24"

# ============================================================================
# Binary Repository Paths
# ============================================================================
linux_package_source: "/data/sp-packages/ba-client/8.1.24"
aix_package_source: "/data/sp-packages/ba-client/8.1.24"
windows_package_source: "/data/sp-packages/ba-client/8.1.24"

# ============================================================================
# Installation Paths
# ============================================================================
install_path: "/opt/tivoli/tsm/client/ba/bin"
state: "present"  # Options: present, absent, upgrade

# ============================================================================
# Server Connection
# ============================================================================
storage_protect_servername: "sp-server-01"
storage_protect_server_ip: "10.10.10.10"
storage_protect_server_port: 1500

# ============================================================================
# Node Configuration
# ============================================================================
storage_protect_nodename: "{{ ansible_hostname }}"
storage_protect_node_password: "{{ vault_node_password }}"

# ============================================================================
# Client Options
# ============================================================================
dsm_opt_optfile_path: "/opt/tivoli/tsm/client/ba/bin/dsm.opt"
dsm_opt_state: "present"

# ============================================================================
# Backup Configuration
# ============================================================================
backup_schedule_enabled: true
backup_compression: true
backup_encryption: false

# ============================================================================
# Query Options
# ============================================================================
q_version: true
q_session: true
q_schedule: true
q_filespace: true
q_backup: false
q_archive: false
q_inclexcl: true
q_systeminfo: true
q_options: true

