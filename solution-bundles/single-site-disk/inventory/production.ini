# IBM Storage Protect - Single-Site Disk Solution
# Production Inventory

# ============================================================================
# SP Server Hosts
# ============================================================================
[sp_servers]
sp-server-01 ansible_host=10.10.10.10 ansible_user=root

# ============================================================================
# BA Client Hosts - Linux
# ============================================================================
[ba_clients_linux]
client-linux-01 ansible_host=10.10.10.20 ansible_user=root
client-linux-02 ansible_host=10.10.10.21 ansible_user=root

# ============================================================================
# BA Client Hosts - AIX
# ============================================================================
[ba_clients_aix]
client-aix-01 ansible_host=10.10.10.30 ansible_user=root

# ============================================================================
# BA Client Hosts - Windows
# ============================================================================
[ba_clients_windows]
client-win-01 ansible_host=10.10.10.40 ansible_user=Administrator

# ============================================================================
# DB2 Servers
# ============================================================================
[db2_servers]
db2-01 ansible_host=10.10.10.50 ansible_user=db2inst1 ansible_become=yes

# ============================================================================
# Group Aggregations
# ============================================================================
[ba_clients:children]
ba_clients_linux
ba_clients_aix
ba_clients_windows

[storage_protect_server]
sp-server-01

[storage_protect_client]
db2-01

# ============================================================================
# Connection Settings
# ============================================================================
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

